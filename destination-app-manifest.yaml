_metadata:
  major_version: 2
display_information:
  name: Slack Workspace Mirror Destination
  description: Creates private archive channels and writes mirrored content.
oauth_config:
  scopes:
    user:
      - channels:read
      - chat:write
      - files:write
      - groups:read
      - groups:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
